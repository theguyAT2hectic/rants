baseURL = "https://rants.2hectic.com/"
languageCode = "en-us"
title = "2 Hectic"
theme = "PaperMod"

[build]
  [build.cachebusters]
    source = ""
    target = ""


[params]
  author = "J. McMullen"
  description = "Philosophy, recovery, politics, and other digressions."
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowShareButtons = false
  defaultTheme = "auto"
  math = true

[params.assets]
  disableFingerprinting = true

[params.homeInfoParams]
  Title = "2 Hectic"
  Content = "Works in progress. Drafts. Digressions. Eventually a coherent body of work."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[menu]
  [[menu.main]]
    name = "Daily"
    url = "/daily"
    weight = 1
  [[menu.main]]
    name = "blog"
    url = "/blog/"
    weight = 1
  [[menu.main]]
    name = "Essays"
    url = "/essays/"
    weight = 1
  [[menu.main]]
    name = "Recovery"
    url = "/recovery/"
    weight = 2
  [[menu.main]]
    name = "Philosophy"
    url = "/philosophy/"
    weight = 3
  [[menu.main]]
    name = "Drafts"
    url = "/drafts/"
    weight = 4

[outputs]
  home = ["HTML", "RSS"]


